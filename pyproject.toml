[project]
name = "syntegra"
version = "0.1.0"
description = "Syntegra Global Education Digital Operating System — Phase 0 foundations (CEDA EdTech-003)"
requires-python = ">=3.14"  # RHEL 10 AppStream python3.14 (Red Hat-supported); 3.15 also tested
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "asyncmy>=0.2.9",
    "cryptography>=42",  # caching_sha2_password auth (MySQL 8 default)
    "aiosqlite>=0.20",
    "orjson>=3.10",
    "pyjwt>=2.10",
    "jellyfish>=1.3",
    "phonenumbers>=9.0",
    "email-validator>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "coverage>=7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntegra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["syntegra"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["syntegra.core.*", "syntegra.governance.*", "syntegra.iam.*", "syntegra.mdm.*", "syntegra.workflow.*"]
strict = true

[tool.coverage.run]
source = ["syntegra"]
branch = true

[tool.importlinter]
root_package = "syntegra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is the foundation and imports no domain package"
type = "forbidden"
source_modules = ["syntegra.core"]
forbidden_modules = ["syntegra.governance", "syntegra.iam", "syntegra.mdm", "syntegra.workflow", "syntegra.platform", "syntegra.web"]

[[tool.importlinter.contracts]]
name = "Domain packages never import the web layer (P9 / §10.2)"
type = "forbidden"
source_modules = ["syntegra.governance", "syntegra.iam", "syntegra.mdm", "syntegra.workflow", "syntegra.platform"]
forbidden_modules = ["syntegra.web", "fastapi"]

[[tool.importlinter.contracts]]
name = "Domain layer is framework-free (ports and adapters, §10.1)"
type = "forbidden"
source_modules = ["syntegra.governance.domain", "syntegra.iam.domain", "syntegra.mdm.domain", "syntegra.workflow.domain", "syntegra.core"]
forbidden_modules = ["sqlalchemy", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Cross-package access only through api and events (§10.2)"
type = "forbidden"
source_modules = ["syntegra.iam", "syntegra.mdm", "syntegra.workflow"]
forbidden_modules = ["syntegra.governance.models", "syntegra.governance.policy"]
allow_indirect_imports = true
